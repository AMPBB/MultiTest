plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'pbbadd.opengl.multitest'
    compileSdk 36

    defaultConfig {
        applicationId "pbbadd.opengl.multitest"
        minSdk 25
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        //add for native compile
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17' // C++17标准
                arguments "-DANDROID_PLATFORM=android-25", "-DANDROID_STL=c++_shared"
            }
        }
    }

    signingConfigs {
        debug {
            // 指向项目根目录的统一调试签名文件
            storeFile rootProject.file("debug.keystore")
            // 默认调试签名密码（固定，不用改）
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug // 关键配置
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    //add for native resource
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

tasks.register('copyDebugApkToDDrive') {
    def sourceApkProvider = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk')
    def targetApk = file('D:/multitest.apk')

    inputs.file(sourceApkProvider)
    outputs.file(targetApk)

    doLast {
        def sourceApk = sourceApkProvider.get().asFile
        if (!sourceApk.exists()) {
            throw new GradleException("Debug APK not found: ${sourceApk}")
        }

        targetApk.withOutputStream { output ->
            sourceApk.withInputStream { input ->
                output << input
            }
        }
        logger.lifecycle("Copied debug APK to ${targetApk}")
    }
}

afterEvaluate {
    tasks.named('assembleDebug') {
        finalizedBy(tasks.named('copyDebugApkToDDrive'))
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
