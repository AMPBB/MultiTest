<!doctype html>
<html lang="en-US" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #ffffff;
            -webkit-font-smoothing: antialiased;
            text-size-adjust: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111111;
            font-family: Roboto, Arial, sans-serif;
        }

        .font-sample {
            font-weight: 400;
            line-height: 1.2;
            white-space: pre;
            transform: translateZ(0);
            will-change: transform;
        }

        .font-size-16 {
            font-size: 16px;
        }

        .font-size-32 {
            font-size: 32px;
        }

        .font-size-64 {
            font-size: 64px;
        }
    </style>
</head>
<body>
    <div>
        <div class="font-sample font-size-16">abc</div>
        <div class="font-sample font-size-32">EFG</div>
        <div class="font-sample font-size-64">hijk</div>
    </div>
</body>
</html>
